<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>晚自习查人工具</title>
<style>
  :root{
    --ink:#1f2933; --sub:#6b7a8f; --line:#dbe3ef; --bg:#f4f6fb;
    --diff-bg:#ffe0b2; --diff-ink:#8a3b00;
    --comm-bg:#dce4f7; --comm-ink:#27408b;
    --free-bg:#e8f6ec; --free-ink:#1e6b34;
    --brand:#1f3864;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;
    padding-bottom:40px;
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--brand); color:#fff;
    padding:10px 12px 12px; box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  header h1{margin:0 0 8px; font-size:16px; font-weight:600; letter-spacing:.5px; display:flex; align-items:center; gap:8px}
  header h1 span.tag{font-size:11px; font-weight:400; background:rgba(255,255,255,.18); padding:2px 7px; border-radius:10px}
  .ctrls{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .ctrls label{font-size:12px; opacity:.85}
  select,input[type=search],button{
    font:inherit; font-size:13px; border-radius:8px; border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12); color:#fff; padding:6px 8px; outline:none;
  }
  select option{color:#111}
  input[type=search]{min-width:96px; flex:1}
  input[type=search]::placeholder{color:rgba(255,255,255,.6)}
  button{cursor:pointer; background:rgba(255,255,255,.9); color:var(--brand); font-weight:600; border-color:transparent}
  button.ghost{background:transparent; color:#fff}
  button.on{background:#ffd166; color:#5a3b00}

  .bar{
    display:flex; gap:8px; padding:10px 12px 0; flex-wrap:wrap; align-items:center;
  }
  .pill{
    font-size:12.5px; padding:5px 10px; border-radius:999px; background:#fff; border:1px solid var(--line);
    color:var(--sub);
  }
  .pill b{color:var(--ink); font-size:13.5px}
  .pill.diff{background:var(--diff-bg); border-color:#f0c088; color:var(--diff-ink)}
  .pill.free{background:var(--free-bg); border-color:#b7e0c3; color:var(--free-ink)}
  .pill.comm{background:var(--comm-bg); border-color:#b9c6ea; color:var(--comm-ink)}

  main{padding:10px 12px 0}
  .sectitle{font-size:12.5px; color:var(--sub); margin:16px 2px 8px; display:flex; align-items:center; gap:8px}
  .sectitle::after{content:""; flex:1; height:1px; background:var(--line)}

  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px}
  .card{
    background:#fff; border:1px solid var(--line); border-left-width:5px; border-radius:10px;
    padding:8px 10px; position:relative;
  }
  .card.diff{border-left-color:#e8871e; background:linear-gradient(180deg,#fff8f0,#fff)}
  .card.comm{border-left-color:#4a63b8; background:linear-gradient(180deg,#f4f7ff,#fff)}
  .card.free{border-left-color:#3fa15e; background:linear-gradient(180deg,#f4fbf6,#fff)}
  .card .nm{font-weight:700; font-size:15px; letter-spacing:.5px}
  .card .st{font-size:11.5px; padding:1px 7px; border-radius:999px; margin-left:6px; vertical-align:2px}
  .card.diff .st{background:var(--diff-bg); color:var(--diff-ink)}
  .card.comm .st{background:var(--comm-bg); color:var(--comm-ink)}
  .card.free .st{background:var(--free-bg); color:var(--free-ink)}
  .card .de{margin-top:4px; font-size:12.5px; color:var(--sub); word-break:break-all}
  .card .de b{color:var(--ink); font-weight:600}
  .card .slot{position:absolute; top:8px; right:9px; font-size:11px; color:#9aa7b8}

  .tablewrap{overflow:auto; background:#fff; border:1px solid var(--line); border-radius:10px; -webkit-overflow-scrolling:touch}
  table{border-collapse:separate; border-spacing:0; font-size:12px; white-space:nowrap}
  th,td{border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:5px 7px; text-align:center}
  thead th{position:sticky; top:0; background:var(--brand); color:#fff; z-index:2; font-weight:600}
  tbody th{position:sticky; left:0; background:#eef2fa; z-index:1; text-align:left; font-weight:600}
  td.diff{background:var(--diff-bg); color:var(--diff-ink); font-weight:600; max-width:130px; overflow:hidden; text-overflow:ellipsis}
  td.comm{background:var(--comm-bg); color:var(--comm-ink)}
  td.free{background:var(--free-bg); color:#7d8b9c}
  tbody tr:hover td{filter:brightness(.97)}
  .legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--sub); margin:8px 2px 0}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:4px; vertical-align:-1px}
  .empty{padding:30px; text-align:center; color:var(--sub)}
  .loose{
    margin:10px 12px 0; padding:9px 11px; border-radius:10px; font-size:12.5px;
    background:#fff7e6; border:1px solid #f0d8a8; color:#7a5200;
  }
  .loose.hide{display:none}
  .loose .row{margin-top:4px; line-height:1.7}
  .loose .k{display:inline-block; min-width:60px; font-weight:700; color:#8a5a00}
  .card .looseNote{margin-top:4px; font-size:11.5px; color:#8a5a00; background:#fff7e6; border-radius:5px; padding:2px 5px}
  footer{padding:18px 14px 6px; font-size:11.5px; color:#9aa7b8; text-align:center}
  @media print{
    header,.ctrls,.noprint{display:none!important}
    body{background:#fff; font-size:12px}
    .card{break-inside:avoid}
    .tablewrap{overflow:visible; border:none}
    thead th{background:#1f3864!important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    td.diff,td.comm,td.free,.card{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  }
</style>
</head>
<body>
<header>
  <h1>晚自习查人 <span class="tag" id="tag">23 人</span></h1>
  <div class="ctrls">
    <label>周次</label>
    <select id="wk"></select>
    <label>星期</label>
    <select id="day"></select>
    <label>节次</label>
    <select id="per"></select>
    <input type="search" id="q" placeholder="搜索姓名…">
    <button id="mode" class="ghost">仅看有课</button>
    <button id="print" class="ghost">打印</button>
  </div>
</header>

<div class="bar" id="bar"></div>
<div class="loose hide" id="loose"></div>

<main>
  <div class="sectitle">逐人核对</div>
  <div class="cards" id="cards"></div>
  <div id="cardsEmpty" class="empty" style="display:none">没有符合条件的人</div>

  <div class="sectitle">网格总览（行=星期×节次，列=姓名）</div>
  <div class="tablewrap"><table id="grid"></table></div>
  <div class="legend">
    <span><i style="background:var(--diff-bg)"></i>个人差异课</span>
    <span><i style="background:var(--comm-bg)"></i>全班共同课</span>
    <span><i style="background:var(--free-bg)"></i>应到自习</span>
  </div>
</main>

<footer>数据源：23 人课表 PDF → 课程明细.csv ｜ 由 build.py 生成，请勿直接改本文件</footer>

const CFG = DATA.config, NAMES = DATA.students, DAYS = DATA.weekdays;
const IDX = new Map();
for (const d of DATA.detail) IDX.set(d[0]+"|"+d[1]+"|"+d[2]+"|"+d[3], {status:d[4], text:d[5], course:d[6], place:d[7], teacher:d[8]});

// 无固定节次的课（军训 / 劳动教育 / 尔雅网课）：按周次建索引
const LOOSE = new Map();
for (const [who, course, weeks, teacher, note] of (DATA.loose || [])) {
  for (const w of weeks) {
    const k = w + "|" + who;
    if (!LOOSE.has(k)) LOOSE.set(k, []);
    LOOSE.get(k).push({course, teacher, note});
  }
}
const LOOSE_TEACHER = new Map();
for (const [who, course, weeks, teacher, note] of (DATA.loose || [])) {
  if (who === "全班") { for (const w of weeks) LOOSE_TEACHER.set(w + "|" + course, {course, teacher, note}); }
}

const $ = id => document.getElementById(id);
let onlyClass = false;

function fillSelects(){
  const wk = $("wk");
  for (let w = 1; w <= CFG.总周数; w++){
    const o = document.createElement("option");
    o.value = w; o.textContent = "第 " + w + " 周";
    if (w === CFG.当前周次) o.selected = true;
    wk.appendChild(o);
  }
  const day = $("day");
  day.appendChild(new Option("整周", "*"));
  DAYS.forEach(d => day.appendChild(new Option(d, d)));
  const per = $("per");
  per.appendChild(new Option("全部节次", "*"));
  for (let p = CFG.晚自习起始节; p <= CFG.晚自习结束节; p++) per.appendChild(new Option("第 " + p + " 节", p));
}

const periods = () => { const a=[]; for(let p=CFG.晚自习起始节;p<=CFG.晚自习结束节;p++) a.push(p); return a; };

function selectedSlots(){
  const daySel = $("day").value, perSel = $("per").value;
  const slots = [];
  for (const d of (daySel === "*" ? DAYS : [daySel]))
    for (const p of periods())
      if (perSel === "*" || String(p) === perSel) slots.push([d, p]);
  return slots;
}

function render(){
  const w = Number($("wk").value);
  const slots = selectedSlots();
  const q = $("q").value.trim();
  const shown = q ? NAMES.filter(n => n.includes(q)) : NAMES.slice();

  // 汇总条
  let nDiff = 0, nComm = 0, nFree = 0;
  const commNames = new Set();
  for (const n of shown){
    let hasDiff = false, hasComm = false;
    for (const [d, p] of slots){
      const key = w+"|"+d+"|"+p+"|"+n, hit = IDX.get(key);
      if (hit && hit.status === "差异课"){ hasDiff = true; commNames.add(hit.course); }
      else if (hit) hasComm = true;
    }
    if (hasDiff) nDiff++; else if (hasComm) nComm++; else nFree++;
  }
  $("bar").innerHTML =
    '<span class="pill diff">有个人差异课 <b>' + nDiff + '</b> 人</span>' +
    '<span class="pill comm">只上共同课 <b>' + nComm + '</b> 人</span>' +
    '<span class="pill free">应到自习 <b>' + nFree + '</b> 人</span>' +
    '<span class="pill">第 <b>' + w + '</b> 周 · ' +
      (slots.length === DAYS.length * periods().length ? "整周全部晚自习" :
        slots.map(s => s[0] + "第" + s[1] + "节").join("、")) + '</span>';

  // 无固定节次的课（军训 / 劳动教育 / 尔雅网课）
  const classLoose = [], peopleLoose = [];
  for (const [k, v] of LOOSE_TEACHER) {
    if (Number(k.split("|")[0]) === w) classLoose.push(v);
  }
  for (const n of NAMES) {
    const list = LOOSE.get(w + "|" + n);
    if (list) peopleLoose.push([n, list]);
  }
  const lbox = $("loose");
  if (classLoose.length || peopleLoose.length) {
    let h = '<div><b>第 ' + w + ' 周 无固定节次的课</b>（不占晚自习格子，请结合实际情况判断）</div>';
    if (classLoose.length)
      h += '<div class="row"><span class="k">全班</span>' +
           classLoose.map(c => c.course + '（' + c.note + '）').join('、') + '</div>';
    if (peopleLoose.length)
      h += '<div class="row"><span class="k">个人</span>' +
           peopleLoose.map(([n, l]) => n + '：' + l.map(c => c.course).join('、')).join('；') + '</div>';
    lbox.innerHTML = h;
    lbox.classList.remove("hide");
  } else {
    lbox.classList.add("hide");
  }

  // 逐人卡片
  const box = $("cards"); box.innerHTML = "";
  let rendered = 0;
  for (const n of shown){
    const items = [];
    for (const [d, p] of slots){
      const hit = IDX.get(w+"|"+d+"|"+p+"|"+n);
      if (hit) items.push({d, p, hit});
    }
    const diffItems = items.filter(x => x.hit.status === "差异课");
    const key = diffItems.length ? "diff" : (items.length ? "comm" : "free");
    if (onlyClass && key === "free") continue;
    rendered++;

    const el = document.createElement("div");
    el.className = "card " + key;
    let st, de;
    if (key === "diff"){
      st = "有课";
      de = diffItems.map(x => '<div><b>' + x.hit.course + '</b>' +
        (x.hit.place ? ' @ ' + x.hit.place : '') +
        '<span class="slot">' + x.d + " " + x.p + '节</span></div>').join("");
    } else if (key === "comm"){
      st = "共同课";
      de = '<div>' + items[0].hit.course + (items[0].hit.place ? ' @ ' + items[0].hit.place : '') + '</div>';
    } else {
      st = "应到自习";
      de = '<div>该时段无课</div>';
    }
    const mine = LOOSE.get(w + "|" + n);
    if (mine) de += '<div class="looseNote">本周另有：' + mine.map(c => c.course).join('、') + '</div>';
    const sid = (DATA.roster || {})[n];
    el.innerHTML = '<div class="nm">' + n + '<span class="st">' + st + '</span></div>' +
      (sid ? '<div style="font-size:11px;color:#9aa7b8">' + sid + '</div>' : '') +
      '<div class="de">' + de + '</div>';
    box.appendChild(el);
  }
  $("cardsEmpty").style.display = rendered ? "none" : "block";

  // 网格
  const g = $("grid");
  let html = "<thead><tr><th style='position:sticky;left:0;z-index:3'>星期 / 节次</th>";
  for (const n of NAMES) html += "<th>" + n + "</th>";
  html += "</tr></thead><tbody>";
  for (const d of DAYS){
    for (const p of periods()){
      html += "<tr><th>" + d + " 第" + p + "节</th>";
      for (const n of NAMES){
        const hit = IDX.get(w+"|"+d+"|"+p+"|"+n);
        if (!hit) html += "<td class='free'>·</td>";
        else if (hit.status === "共同课") html += "<td class='comm' title='" + hit.course + "'>共同课</td>";
        else html += "<td class='diff' title='" + hit.text + "'>" + hit.text + "</td>";
      }
      html += "</tr>";
    }
  }
  html += "</tbody>";
  g.innerHTML = html;
}

function init(){
  fillSelects();
  ["wk", "day", "per"].forEach(id => $(id).addEventListener("change", render));
  $("q").addEventListener("input", render);
  $("mode").addEventListener("click", e => {
    onlyClass = !onlyClass;
    e.target.classList.toggle("on", onlyClass);
    e.target.textContent = onlyClass ? "显示全部" : "仅看有课";
    render();
  });
  $("print").addEventListener("click", () => window.print());
  render();
}
init();
</script>
</body>
</html>

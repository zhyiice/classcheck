<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>晚自习查人工具</title>
<style>
  :root{
    --ink:#1f2933; --sub:#6b7a8f; --line:#dbe3ef; --bg:#f4f6fb;
    --diff-bg:#fff0dc; --diff-line:#e8871e; --diff-ink:#8a3b00;
    --comm-bg:#dce4f7; --comm-line:#4a63b8; --comm-ink:#27408b;
    --free-bg:#e8f6ec; --free-line:#3fa15e; --free-ink:#1e6b34;
    --brand:#1f3864;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5; padding-bottom:40px;
  }
  body.dev-desktop{font-size:14.5px}

  /* ---------- 顶栏 ---------- */
  header{
    position:sticky; top:0; z-index:30; background:var(--brand); color:#fff;
    padding:9px 12px 11px; box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .hrow{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .hrow h1{margin:0; font-size:16px; font-weight:600; letter-spacing:.4px; flex:1;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .hrow h1 .tag{font-size:11px; font-weight:400; background:rgba(255,255,255,.18);
                padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:1px}
  .hbtns{display:flex; gap:6px; flex:0 0 auto}
  .ctrls{display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center}
  .ctrls label{font-size:12px; opacity:.85}
  select,input[type=search],button{
    font:inherit; font-size:13px; border-radius:8px; border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12); color:#fff; padding:6px 8px; outline:none;
  }
  select option{color:#111}
  body.dev-mobile select,body.dev-mobile input[type=search]{font-size:13px; padding:5px 7px}
  input[type=search]{min-width:110px; flex:1 1 110px}
  input[type=search]::placeholder{color:rgba(255,255,255,.6)}
  button{cursor:pointer; background:rgba(255,255,255,.9); color:var(--brand); font-weight:600; border-color:transparent}
  button.ghost{background:transparent; color:#fff}
  button.on{background:#ffd166; color:#5a3b00}

  /* ---------- 可折叠的黄色提示块 ---------- */
  .loose{margin:10px 12px 0; border-radius:10px; background:#fff7e6; border:1px solid #f0d8a8;
         color:#7a5200; font-size:12.5px; overflow:hidden}
  .loose.hide{display:none}
  .lhead{display:flex; align-items:center; gap:8px; width:100%; background:transparent; border:0;
         color:#7a5200; font-weight:700; font-size:12.5px; padding:9px 11px; cursor:pointer; text-align:left}
  .lhead .cnt{margin-left:auto; font-weight:400; color:#a8791f}
  .lhead .arrow{transition:transform .28s ease; display:inline-block; color:#a8791f}
  .loose.open .lhead .arrow{transform:rotate(180deg)}
  .lbody{max-height:0; opacity:0; overflow:hidden;
         transition:max-height .3s ease, opacity .25s ease, padding .3s ease; padding:0 11px}
  .loose.open .lbody{max-height:460px; opacity:1; padding:0 11px 11px}
  .linner{line-height:1.75}
  .linner .k{display:inline-block; min-width:56px; font-weight:700; color:#8a5a00}

  /* ---------- 上课人员筛选 ---------- */
  .pf{display:flex; align-items:center; gap:8px; margin:10px 12px 0; padding:8px 11px;
      background:#fff; border:1px solid var(--line); border-radius:10px; font-size:12.5px; color:var(--sub)}
  .pf select{background:#f4f6fb; color:var(--ink); border-color:var(--line); flex:1; min-width:0; font-weight:600}

  /* ---------- 统计小字 ---------- */
  .stats{padding:12px 14px 0; font-size:12.5px; color:var(--sub); display:flex; flex-wrap:wrap; gap:4px 12px}
  .stats b{color:var(--ink); font-size:13.5px}
  .stats .cat{background:#fff0dc; color:var(--diff-ink); border:1px solid #f0c088;
              border-radius:999px; padding:2px 9px; font-weight:600}
  .stats .cat b{color:var(--diff-ink)}

  main{padding:0 12px}
  .sectitle{font-size:12.5px; color:var(--sub); margin:14px 2px 8px; display:flex; align-items:center; gap:8px}
  .sectitle::after{content:""; flex:1; height:1px; background:var(--line)}

  /* ---------- 卡片（电脑） ---------- */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:9px}
  .card{background:#fff; border:1px solid var(--line); border-left-width:5px; border-radius:10px;
        padding:8px 11px; min-width:0}
  .card.diff{border-left-color:var(--diff-line); background:linear-gradient(180deg,#fffaf3,#fff)}
  .card.comm{border-left-color:var(--comm-line); background:linear-gradient(180deg,#f6f8ff,#fff)}
  .card.free{border-left-color:var(--free-line); background:linear-gradient(180deg,#f5fbf7,#fff)}
  .card .hd{display:flex; align-items:baseline; gap:6px; min-width:0}
  .card .no{font-size:11px; color:#9aa7b8; font-variant-numeric:tabular-nums; flex:0 0 auto; min-width:18px}
  .card .nm{font-weight:700; font-size:15px; letter-spacing:.5px; flex:0 0 auto}
  .card .st{font-size:11.5px; padding:1px 7px; border-radius:999px; flex:0 0 auto}
  .card .sid{margin-left:auto; font-size:10.5px; color:#b3bdcc; flex:0 0 auto}
  .card.diff .st{background:var(--diff-bg); color:var(--diff-ink)}
  .card.comm .st{background:var(--comm-bg); color:var(--comm-ink)}
  .card.free .st{background:var(--free-bg); color:var(--free-ink)}
  .card .de{margin-top:4px; font-size:12.5px; color:var(--sub); min-width:0}
  .card .c{padding:2px 0; border-top:1px dashed #eef1f7; word-break:break-word}
  .card .c:first-child{border-top:0}
  .card .cn{color:var(--ink); font-weight:600}
  .card .wk{color:#c1743a; font-size:11.5px; margin-left:3px}
  .card .loc{color:#6b7a8f; font-size:11.5px; margin-left:4px}
  .card .when{color:#a3aebd; font-size:11px; margin-left:5px; white-space:nowrap}
  .card .looseNote{margin-top:4px; font-size:11.5px; color:#8a5a00; background:#fff7e6; border-radius:5px; padding:2px 6px}

  /* ---------- 卡片（手机：窄横向列表） ---------- */
  body.dev-mobile .cards{display:block}
  body.dev-mobile .card{
    display:flex; align-items:center; gap:8px; padding:6px 9px; margin-bottom:5px;
    border-left-width:4px; border-radius:8px; background:#fff;
  }
  body.dev-mobile .card .hd{flex:0 0 auto; gap:5px}
  body.dev-mobile .card .nm{font-size:14px}
  body.dev-mobile .card .st{font-size:10.5px; padding:0 6px}
  body.dev-mobile .card .no{min-width:15px; font-size:10.5px}
  body.dev-mobile .card .sid{display:none}
  body.dev-mobile .card .de{
    margin:0; flex:1 1 auto; min-width:0; font-size:12px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  body.dev-mobile .card .c{display:inline; border:0; padding:0}
  body.dev-mobile .card .c + .c::before{content:"；"; color:#c3ccd9}
  body.dev-mobile .card .when{display:none}
  body.dev-mobile .card .looseNote{display:none}
  body.dev-mobile .stats,body.dev-mobile main,body.dev-mobile .pf,
  body.dev-mobile .loose{margin-left:8px; margin-right:8px; padding-left:0; padding-right:0}
  body.dev-mobile .pf{padding:7px 9px}

  /* ---------- 网格表 ---------- */
  .tablewrap{overflow:auto; background:#fff; border:1px solid var(--line); border-radius:10px; -webkit-overflow-scrolling:touch}
  table{border-collapse:separate; border-spacing:0; font-size:12px; white-space:nowrap}
  th,td{border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:5px 7px; text-align:center}
  thead th{position:sticky; top:0; background:var(--brand); color:#fff; z-index:2; font-weight:600}
  thead th.gno{background:#2b4a7d; font-size:10.5px; color:#c9d6ee}
  tbody th{position:sticky; left:0; background:#eef2fa; z-index:1; text-align:left; font-weight:600}
  td.diff{background:var(--diff-bg); color:var(--diff-ink); text-align:left; vertical-align:top}
  td.diff .c{display:block; line-height:1.45}
  td.comm{background:var(--comm-bg); color:var(--comm-ink)}
  td.free{background:var(--free-bg); color:#7d8b9c}
  .legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--sub); margin:8px 2px 0}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:4px; vertical-align:-1px}
  .empty{padding:26px; text-align:center; color:var(--sub)}
  footer{padding:18px 14px 6px; font-size:11.5px; color:#9aa7b8; text-align:center}

  @media print{
    header,.pf,.lhead,.hbtns{display:none!important}
    body{background:#fff; font-size:12px; padding-bottom:0}
    .loose.open .lbody{max-height:none; opacity:1}
    .loose{break-inside:avoid}
    .card{break-inside:avoid}
    .tablewrap{overflow:visible; border:none}
    thead th{background:#1f3864!important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    td.diff,td.comm,td.free,.card,.stats .cat{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  }
</style>
</head>
<body>
<script>
/* 首屏就定好手机/电脑，避免闪一下大卡片 */
(function () {
  try {
    var s = localStorage.getItem("wl_checker_ver");
    if (s !== "mobile" && s !== "desktop") {
      var ua = navigator.userAgent || "";
      var w = Math.min(window.innerWidth || 9999, (window.screen && window.screen.width) || 9999);
      s = (/Android|iPhone|iPod|iPad|Windows Phone|HarmonyOS|Mobile|MicroMessenger|MiuiBrowser|HeyTapBrowser|Quark/i.test(ua) || w < 700) ? "mobile" : "desktop";
    }
    document.body.className = "dev-" + s;
  } catch (e) {}
})();
</script>
<header>
  <div class="hrow">
    <h1>晚自习查人<span class="tag" id="devtag">电脑版</span></h1>
    <div class="hbtns">
      <button id="devbtn" class="ghost">切手机版</button>
      <button id="printbtn" class="ghost">打印</button>
    </div>
  </div>
  <div class="ctrls">
    <label>周次</label><select id="wk"></select>
    <label>星期</label><select id="day"></select>
    <label>节次</label><select id="per"></select>
    <input type="search" id="q" placeholder="搜索姓名…">
  </div>
</header>

<div class="loose hide" id="loose">
  <button class="lhead" id="looseHead" type="button">
    <span id="looseTitle">本周无固定节次的课</span>
    <span class="cnt" id="looseCnt"></span>
    <span class="arrow">▾</span>
  </button>
  <div class="lbody"><div class="linner" id="looseInner"></div></div>
</div>

<div class="pf">
  <label for="who">上课人员筛选</label>
  <select id="who"></select>
</div>

<main>
  <div class="stats" id="stats"></div>
  <div class="sectitle">逐人核对</div>
  <div class="cards" id="cards"></div>
  <div class="empty" id="cardsEmpty" style="display:none">没有符合条件的人</div>

  <div class="sectitle">网格总览（行 = 姓名，按学号排序；列 = 星期）</div>
  <div class="tablewrap"><table id="grid"></table></div>
  <div class="legend">
    <span><i style="background:var(--diff-bg)"></i>个人差异课</span>
    <span><i style="background:var(--comm-bg)"></i>全班共同课</span>
    <span><i style="background:var(--free-bg)"></i>应到自习</span>
  </div>
</main>

const CFG = DATA.config, NAMES = DATA.students, DAYS = DATA.weekdays, ROSTER = DATA.roster || {};

// 索引：周次|星期|姓名 → {status, courses:[[名称,周次,地点,教师],...]}

for (const [who, course, weeks, teacher, note] of (DATA.loose || [])) {

  for (const w of weeks) {
    const k = w + "|" + who;
    if (!LOOSE.has(k)) LOOSE.set(k, []);
    LOOSE.get(k).push({ course, teacher, note });

/* ==================== 设备检测 ==================== */
const LSKEY = "wl_checker_ver";
function detectDevice() {
  let saved = null;
  try { saved = localStorage.getItem(LSKEY); } catch (e) {}
  if (saved === "mobile" || saved === "desktop") return saved;
  const ua = navigator.userAgent || "";
  const uaMobile = /Android|iPhone|iPod|iPad|Windows Phone|HarmonyOS|Mobile|MicroMessenger|MiuiBrowser|HeyTapBrowser|Quark/i.test(ua);
  const coarse = window.matchMedia ? window.matchMedia("(pointer:coarse)").matches : false;
  const screenW = (window.screen && window.screen.width) || 9999;
  const vw = window.innerWidth || 9999;
  if (uaMobile) return "mobile";
  if (Math.min(vw, screenW) < 700) return "mobile";
  if (coarse && Math.min(vw, screenW) < 1100) return "mobile";
  return "desktop";
}
let device = detectDevice(), manual = false;
try { manual = !!localStorage.getItem(LSKEY); } catch (e) {}

function applyDevice() {
  document.body.classList.toggle("dev-mobile", device === "mobile");
  document.body.classList.toggle("dev-desktop", device === "desktop");
  $("devtag").textContent = device === "mobile" ? "手机版" : "电脑版";
  $("devbtn").textContent = device === "mobile" ? "切电脑版" : "切手机版";
}

/* ==================== 当前时间 → 默认周次/星期 ==================== */
function currentWeekNo() {
  const s = CFG.学期开始日期;
  if (!s) return CFG.当前周次;
  const start = new Date(s + "T00:00:00");
  if (isNaN(start.getTime())) return CFG.当前周次;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.floor((today - start) / 86400000);
  if (days < 0) return 1;
  return Math.min(Math.max(Math.floor(days / 7) + 1, 1), CFG.总周数);
}
function currentDay() {
  // JS: 0=周日 … 6=周六
  const i = new Date().getDay();
  return DAYS[(i + 6) % 7];
}

/* ==================== 初始化下拉 ==================== */
let onlyClass = false, whoFilter = "all";

function fillSelects() {
  const wk = $("wk");
  for (let w = 1; w <= CFG.总周数; w++) wk.appendChild(new Option("第 " + w + " 周", w));
  wk.value = String(currentWeekNo());

  const day = $("day");
  DAYS.forEach(d => day.appendChild(new Option(d, d)));
  day.appendChild(new Option("整周", "*"));          // “整周”放最后
  day.value = currentDay();

  const per = $("per");
  per.appendChild(new Option(BLOCK + " 节", BLOCK));
  per.appendChild(new Option("全部节次", "*"));       // “全部节次”放最后
  per.value = BLOCK;
}

/* ==================== 渲染 ==================== */
function activeSlots() {
  const daySel = $("day").value, perSel = $("per").value;
  if (perSel === "*") return [];
  const days = daySel === "*" ? DAYS : [daySel];
  return days.map(d => [d, BLOCK]);
}

function courseListFor(w, days) {
  // 当前周次 + 当前星期下出现过的所有课程名（用于“上课人员筛选”）
  const set = new Set();
  for (const d of days) for (const n of NAMES) {
    const hit = IDX.get(w + "|" + d + "|" + n);
    if (hit && hit.status !== "共同课") hit.courses.forEach(c => set.add(c[0]));
    else if (hit) hit.courses.forEach(c => set.add(c[0]));
  }
  return [...set].sort((a, b) => a.localeCompare(b, "zh"));
}

function renderWhoOptions(w, slots) {
  const sel = $("who");
  // 只按「当前选中的星期」取课；节次选「全部节次」也不会退化成整周所有课
  const daySel = $("day").value;
  const days = daySel === "*" ? DAYS : [daySel];
  const courses = courseListFor(w, days);
  const prev = sel.value;
  sel.innerHTML = "";
  sel.appendChild(new Option(daySel === "*" ? "查看全部人员（整周）" : "查看全部人员（" + daySel + "）", "all"));
  sel.appendChild(new Option("只看应到人员（无课）", "free"));
  if (!courses.length) {
    const o = new Option("（这天的晚自习没有课）", "none");
    o.disabled = true;
    sel.appendChild(o);
  }
  courses.forEach(c => sel.appendChild(new Option(c + "上课人员", "c:" + c)));
  sel.value = [...sel.options].some(o => o.value === prev) ? prev : "all";
  whoFilter = sel.value;
}

    if (whoFilter === "free" && !isFree(it)) continue;
    if (whoFilter.startsWith("c:") && !hasCourse(it, whoFilter.slice(2))) continue;
    if (onlyClass && isFree(it)) continue;
    rendered++;

    const hasDiff = it.items.some(x => x.hit.status !== "共同课");
    const key = hasDiff ? "diff" : (it.items.length ? "comm" : "free");
    const st = key === "diff" ? "有课" : (key === "comm" ? "共同课" : "应到自习");
    const no = (ROSTER[it.name] && ROSTER[it.name].序号) || "";
    const sid = (ROSTER[it.name] && ROSTER[it.name].学号) || "";

    let de = "";
    if (key === "free") {
      de = '<div class="c">该时段无课</div>';
    } else if (key === "comm") {
      de = it.items.map(x => '<div class="c"><span class="cn">' +
        esc(x.hit.courses.map(c => c[0]).join(" / ")) + '</span>' +
        (multiDay ? '<span class="when">' + x.day + '</span>' : '') + '</div>').join("");
    } else {
      for (const x of it.items) {
        if (x.hit.status === "共同课") continue;
        for (const c of x.hit.courses) {
          de += '<div class="c"><span class="cn">' + esc(c[0]) + '</span>' +
                '<span class="wk">(' + esc(c[1]) + '周)</span>' +
                (c[2] ? '<span class="loc">@' + esc(c[2]) + '</span>' : '') +
                (multiDay ? '<span class="when">' + x.day + ' ' + BLOCK + '节</span>' : '') +
                '</div>';
        }
      }
    }
    const mine = LOOSE.get(w + "|" + it.name);
    if (mine) de += '<div class="looseNote">本周另有：' + esc(mine.map(c => c.course).join("、")) + '</div>';

    // 手机版把课程压成一行纯文本
    let deMobile = de;
    if (device === "mobile") {
      if (key === "free") deMobile = "该时段无课";
      else {
        const arr = [];
        for (const x of it.items) for (const c of x.hit.courses) arr.push(c[0] + "(" + c[1] + "周)" + (c[2] ? "@" + c[2] : ""));
        deMobile = esc(arr.join("；"));
      }
    }
    const el = document.createElement("div");
    el.className = "card " + key;
    el.innerHTML = '<div class="hd"><span class="no">' + no + '</span>' +
      '<span class="nm">' + esc(it.name) + '</span>' +
      '<span class="st">' + st + '</span>' +
      (sid ? '<span class="sid">' + esc(sid) + '</span>' : '') + '</div>' +
      '<div class="de">' + deMobile + '</div>';
    box.appendChild(el);
  }
  $("cardsEmpty").style.display = rendered ? "none" : "block";

  // ---- 网格 ----
  const g = $("grid");
  let html = "<thead><tr><th class='gno' style='position:sticky;left:0;z-index:4'>序号</th>" +
             "<th style='position:sticky;left:56px;z-index:4'>姓名</th>";
  for (const d of DAYS) html += "<th>" + d + " " + BLOCK + "节</th>";
  html += "</tr></thead><tbody>";
  for (let i = 0; i < NAMES.length; i++) {
    const n = NAMES[i];
    const no = (ROSTER[n] && ROSTER[n].序号) || (i + 1);
    let good = false;
    for (const d of DAYS) {
      const hit = IDX.get(w + "|" + d + "|" + n);
      if (hit && hit.status !== "共同课") { good = true; break; }
    }
    if (whoFilter === "free" && good) continue;
    if (whoFilter.startsWith("c:")) {
      const c = whoFilter.slice(2);
      let has = false;
      for (const d of DAYS) {
        const hit = IDX.get(w + "|" + d + "|" + n);
        if (hit && hit.status !== "共同课" && hit.courses.some(cc => cc[0] === c)) { has = true; break; }
      }
      if (!has) continue;
    }
    if (q && !n.includes(q)) continue;
    html += "<tr><th>" + no + "</th><th>" + esc(n) + "</th>";
    for (const d of DAYS) {
      const hit = IDX.get(w + "|" + d + "|" + n);
      if (!hit) html += "<td class='free'>·</td>";
      else if (hit.status === "共同课") html += "<td class='comm'>共同课</td>";
      else {
        const inner = hit.courses.map(c => '<span class="c">' + esc(c[0]) +
          '<span class="wk">(' + esc(c[1]) + '周)</span>' +
          (c[2] ? '<span class="loc">@' + esc(c[2]) + '</span>' : '') + '</span>').join("");
        html += "<td class='diff'>" + inner + "</td>";
      }
    }
    html += "</tr>";
  }
  html += "</tbody>";
  g.innerHTML = html;
}

/* ==================== 事件 ==================== */
function init() {
  fillSelects();
  applyDevice();
  ["wk", "day", "per"].forEach(id => $(id).addEventListener("change", () => { render(); renderWhoOptions(Number($("wk").value), activeSlots()); render(); }));
  $("q").addEventListener("input", render);
  $("who").addEventListener("change", () => { whoFilter = $("who").value; render(); });
  $("looseHead").addEventListener("click", () => $("loose").classList.toggle("open"));
  $("printbtn").addEventListener("click", () => window.print());
  $("devbtn").addEventListener("click", () => {
    device = device === "mobile" ? "desktop" : "mobile";
    manual = true;
    try { localStorage.setItem(LSKEY, device); } catch (e) {}
    applyDevice();
    render();
  });

  // 旋转 / 缩放时重新判定（用户手动切换过就不再自动改）
  let t = null;
  window.addEventListener("resize", () => {
    if (manual) return;
    clearTimeout(t);
    t = setTimeout(() => {
      const d = detectDevice();
      if (d !== device) { device = d; applyDevice(); render(); }
    }, 250);
  });

  const w = Number($("wk").value);
  renderWhoOptions(w, activeSlots());
  render();
}
init();
</script>

</html>
